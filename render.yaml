services:
  # ── FastAPI backend ──────────────────────────────────────────────────────────
  - type: web
    name: ehi-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PATH
        value: ./ehi.db
      # Set CORS_ORIGINS to your frontend URL once deployed, e.g.:
      # - key: CORS_ORIGINS
      #   value: https://ehi-frontend.onrender.com

  # ── React frontend ───────────────────────────────────────────────────────────
  - type: web
    name: ehi-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: npx serve -s frontend/dist -l $PORT
